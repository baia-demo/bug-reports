name: Relay Feedback

# Quando uma issue ganha label needs-triage, dispara o workflow de triagem
# no apresentacao-baia via repository_dispatch (event_type: feedback-labeled).

on:
  issues:
    types: [labeled]

jobs:
  relay:
    if: github.event.label.name == 'needs-triage'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar triagem no apresentacao-baia
        env:
          GH_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          gh api -X POST \
            /repos/${{ vars.TRIAGE_REPO }}/dispatches \
            -f event_type=feedback-labeled \
            -f "client_payload[issue_number]=${{ github.event.issue.number }}" \
            -f "client_payload[issue_url]=${{ github.event.issue.html_url }}"
